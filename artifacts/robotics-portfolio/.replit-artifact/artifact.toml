kind = "web"
previewPath = "/"
title = "Daniel Liu — Robotics Portfolio"
description = "A robotics-themed personal portfolio for Daniel Liu's Replit internship application, featuring his engineering profile, selected GitHub projects, technical interests, and contact links in a focused black-and-white interface."
version = "1.0.0"
id = "artifacts/robotics-portfolio"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 25039

[services.development]
run = "pnpm --filter @workspace/robotics-portfolio run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/robotics-portfolio", "run", "build" ]
serve = "static"
publicDir = "artifacts/robotics-portfolio/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "25039"
BASE_PATH = "/"
