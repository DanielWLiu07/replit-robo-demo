kind = "web"
previewPath = "/"
title = "FLYWEIGHT — Small brain. Big fight."
description = "FLYWEIGHT is a browser-based robotics experiment where users build connectome-inspired battle bots and watch their brains compete."
version = "1.0.0"
id = "artifacts/robotics-portfolio"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 25039

[services.development]
run = "pnpm --filter @workspace/mockup-sandbox run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/mockup-sandbox", "run", "build" ]
serve = "static"
publicDir = "artifacts/mockup-sandbox/dist"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "25039"
BASE_PATH = "/"
